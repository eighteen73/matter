name: Lint and test

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - main
      - next
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lint Suite
        uses: eighteen73/github-actions/.github/actions/lint@main

  tests:
    name: Unit tests and PHPUnit (wp-env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      # Node 24: wp-env 12 depends on WordPress Playground packages that
      # need it (the build itself works on .nvmrc's version too).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installs Composer dependencies too (postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npm run env:start

      - name: Run PHPUnit
        run: npm run test:php

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Keyboard, overlay, menu and editor behaviour, plus axe (WCAG 2.2 AA).
      - name: Run browser tests
        run: npm run test:e2e

      - name: Keep browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: artifacts/
          retention-days: 7
