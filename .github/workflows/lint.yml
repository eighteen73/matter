name: Lint and test

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - main
      - next
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lint Suite
        uses: eighteen73/github-actions/.github/actions/lint@main

  php-tests:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Installs Composer dependencies too (postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npm run env:start

      - name: Run PHPUnit
        run: npm run test:php
