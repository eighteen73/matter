name: Build to "release" branch

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: "Update release branch"
    uses: eighteen73/github-actions/.github/workflows/build-and-release-node.yml@3387d9757c92b88919c82432cd65b9800ec99b82 # main on 20 Nov 2026; bump deliberately
    with:
      node_version: 26
      source_branch: main
      release_branch: release
      run_composer_install: true
      built_asset_paths: build
      plugin_file: matter.php
